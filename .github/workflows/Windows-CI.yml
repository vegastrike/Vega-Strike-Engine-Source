name: Windows-CI
permissions:
  contents: read
  pull-requests: read

# Controls when the action will run.
on:
  push:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:              windows-2022
            triplet:         x64-win10
            preset-name:     VS2022Win64-pie-enabled-debug
            python-version:  3.14
            is-release:      0
          - os:              windows-2025
            triplet:         x64-win10
            preset-name:     VS2026Win64-pie-enabled-RelWithDebInfo
            python-version:  3.14
            is-release:      0

    env:
      CMAKE_FIND_DEBUG_MODE: "OFF"
      CMAKE_VERBOSE_MAKEFILE: "OFF"
      VCPKG_DISABLE_METRICS: 'ON'
      VCPKG_ROOT: "${{ github.workspace }}/vcpkg"
      VCPKG_ASSET_SOURCES: "${{ github.workspace }}/vcpkgAssets"
      X_VCPKG_ASSET_SOURCES: clear;x-azurl,file:///${{ github.workspace }}/vcpkgAssets,,readwrite
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkgBin,readwrite
      VCPKG_BUILD_TREES: "${{ github.workspace }}/vcpkgBuild"
      VCPKG_INSTALL_OPTIONS: "--x-buildtrees-root=${{ github.workspace }}/vcpkgBuild"
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
      VCPKG_OVERLAY_PORTS: "${{ github.workspace }}/custom-triplets"
      PYTHONHOME: ""
      PYTHONPATH: ""
      INSTALL_GTEST: 1
      USE_GTEST: 1

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: false

      - name: Restore vcpkg cache
        id: cache-vcpkg-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}\vcpkgAssets
            ${{ github.workspace }}\vcpkgBCache
            ${{ github.workspace }}\vcpkgBin
            ${{ github.workspace }}\vcpkgBuild
          key: vcpkgCache-${{ github.repository_owner }}-${{ matrix.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Create directories on cache miss
        run: |
          New-Item -Force -ItemType Directory -Path "${{ github.workspace }}\vcpkgAssets"
          New-Item -Force -ItemType Directory -Path "${{ github.workspace }}\vcpkgBCache"
          New-Item -Force -ItemType Directory -Path "${{ github.workspace }}\vcpkgBin"
          New-Item -Force -ItemType Directory -Path "${{ github.workspace }}\vcpkgBuild"
        shell: pwsh
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: vega-py-setup
        with:
          python-version: ${{ matrix.python-version }}
          update-environment: false

      - name: Install CMake
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a #v4.4.5

      - name: Install vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          binaryCachePath: "${{ github.workspace }}/vcpkgBCache"
          runVcpkgInstall: true

      - name: Save vcpkg cache
        id: cache-vcpkg-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}\vcpkgAssets
            ${{ github.workspace }}\vcpkgBCache
            ${{ github.workspace }}\vcpkgBin
            ${{ github.workspace }}\vcpkgBuild
          key: ${{ steps.cache-vcpkg-restore.outputs.cache-primary-key }}
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'

      - name: Build the code
        run: |
          & "${{ github.workspace }}\\script\\build.ps1" -PresetName "${{ matrix.preset-name }}"
        shell: pwsh
        env:
          Python3_ROOT_DIR: ${{ steps.vega-py-setup.outputs.python-path }}
          Python_ROOT_DIR: ${{ steps.vega-py-setup.outputs.python-path }}
          pythonLocation: ${{ steps.vega-py-setup.outputs.python-path }}

      - name: Test the code
        run: |
          Get-ChildItem -Recurse -Force -File -Filter "python_tests.py"
          Get-ChildItem -Recurse -Force -File -Filter 'units.json'
          Get-ChildItem -Recurse -Force -File -Filter 'vegastrike.config'
          Get-ChildItem -Recurse -Force -Filter "test_assets"
          & "${{ github.workspace }}\\script\\test.ps1" -PresetName "${{ matrix.preset-name }}"
        working-directory: "${{ github.workspace }}"
        shell: pwsh
        env:
          Python3_ROOT_DIR: ${{ steps.vega-py-setup.outputs.python-path }}
          Python_ROOT_DIR: ${{ steps.vega-py-setup.outputs.python-path }}
          pythonLocation: ${{ steps.vega-py-setup.outputs.python-path }}

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test_results_xml
          path: "${{ github.workspace }}/build/${{ matrix.preset-name }}/test-results/**/*.xml"
